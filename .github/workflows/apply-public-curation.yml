name: Apply authorized public curation
on:
  push:
    branches: [research/assignment-02-evidence-integration-20261009]
    paths: [.github/workflows/apply-public-curation.yml]
permissions:
  contents: write
concurrency:
  group: envr-public-curation
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Require the authorized public repository and branch
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$GITHUB_REPOSITORY" = mj3b/envr-e119g-sustainable-cities-study
          test "$GITHUB_REF" = refs/heads/research/assignment-02-evidence-integration-20261009
          test "$PRIVATE" = false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Verify every input and output before applying changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          from datetime import datetime, timezone
          root=pathlib.Path.cwd()
          repo='mj3b/envr-e119g-sustainable-cities-study'
          compact_shas=['8ed0b7f75a0ce6f39dbf738ff3ab13157aae3d78','6c9cd18bce725bcb1b443ba0377033d6d0b0c73b','4da3217eadec3ee1754be6590ce9acb80bb9ee20']
          history_shas=['e33ecebd48c2e332b75fb559942eff301e7e594b','ab8a0c8f40a35522944aff1fd84047e12c2d8fa3']
          compact_digest='ab625b6644bbf80f268105e2ca5c4c01b8e38deab8ea21c7e10ed84b3dcd4067'
          history_digest='a0cfa5802921e40aa44923bca5fa3fe199cf41ce4bfa2eb47e66b2c923ac480e'
          def get_json(shas,expected):
              parts=[]
              for sha in shas:
                  request=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
                  with urllib.request.urlopen(request,timeout=30) as response:
                      obj=json.loads(response.read(1000000))
                  if obj.get('encoding')!='base64': raise ValueError('Unexpected blob encoding')
                  data=base64.b64decode(''.join(obj['content'].split()),validate=True)
                  actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                  if actual!=sha: raise ValueError('Blob hash mismatch')
                  parts.append(data)
              packed=b''.join(parts)
              if hashlib.sha256(packed).hexdigest()!=expected: raise ValueError('Aggregate hash mismatch')
              decoder=lzma.LZMADecompressor()
              raw=decoder.decompress(packed,max_length=2000000)
              if not decoder.eof or decoder.unused_data: raise ValueError('Invalid or oversized compressed payload')
              return json.loads(raw)
          payload=get_json(compact_shas,compact_digest)
          history=get_json(history_shas,history_digest)
          if payload['schema']!=1 or len(payload['files'])!=28: raise ValueError('Unexpected payload structure')
          if payload['base_commit']!='7995550b0757734ab8d10660b47c38585cfa5c63': raise ValueError('Unexpected base')
          subprocess.run(['git','merge-base','--is-ancestor',payload['base_commit'],'HEAD'],check=True)
          allowed_history={'ENVR_E119g_Cerrillos_Source_Closure_Sprint.md','ENVR_E119g_Cerrillos_Source_Closure_Ledger.json'}
          if set(history)!=allowed_history: raise ValueError('Unexpected historical files')
          pending=[]; seen=set()
          for entry in payload['files']:
              name=entry['path']; rel=pathlib.PurePosixPath(name)
              if name in seen or rel.is_absolute() or any(p in ('..','.git','private') for p in rel.parts) or '\\' in name: raise ValueError('Unsafe or duplicate path')
              if rel.suffix not in ('.md','.json','.py','.yml'): raise ValueError('Unexpected file type')
              target=root.joinpath(*rel.parts)
              if target.is_symlink() or any(p.is_symlink() for p in target.parents if p!=root.parent): raise ValueError('Symlink not permitted')
              prior=target.read_bytes() if target.is_file() else None
              old=hashlib.sha256(prior).hexdigest() if prior is not None else None
              if old!=entry['old_sha256']: raise ValueError('Base conflict: '+name)
              modes=[key for key in ('content','prepend','from_old_archive_basename') if key in entry]
              if len(modes)!=1: raise ValueError('Invalid materialization mode')
              if modes[0]=='content': data=entry['content'].encode('utf-8')
              elif modes[0]=='prepend':
                  if prior is None: raise ValueError('Missing prefix target')
                  data=entry['prepend'].encode('utf-8')+prior
              else:
                  basename=entry['from_old_archive_basename']
                  if basename not in allowed_history: raise ValueError('Unapproved history file')
                  data=history[basename].encode('utf-8')
              if hashlib.sha256(data).hexdigest()!=entry['sha256']: raise ValueError('New content mismatch: '+name)
              data.decode('utf-8')
              seen.add(name); pending.append((target,data))
          for target,data in pending:
              target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          audit=root/'audit/2026-10-09-public-integration-delivery.json'
          if audit.exists(): raise ValueError('Delivery record already exists')
          audit.write_text(json.dumps({'schema_version':1,'recorded_at_utc':datetime.now(timezone.utc).isoformat(),'activity':'deterministic file delivery; not source revalidation or human approval','base_commit':payload['base_commit'],'trigger_commit':os.environ['GITHUB_SHA'],'compact_sha256':compact_digest,'history_sha256':history_digest,'compact_blob_shas':compact_shas,'history_blob_shas':history_shas,'materialized_files':[{k:e[k] for k in ('path','old_sha256','sha256')} for e in payload['files']],'historical_transfer_note':'The earlier 12-part transfer failed XZ decompression in workflow run 38006886267. It was not used. The two historical files were retransferred from the preserved local originals, with their existing per-file SHA-256 values verified. This repairs delivery only; it does not revise their contents or source statuses.','public_scope':'28 curated files, including two unchanged historical exports; other historical exports indexed, not represented as published','human_scholarly_approval':None,'live_jev_calls':0},indent=2,ensure_ascii=False)+'\n')
          print('Verified and materialized 28 curated files; preserved both historical exports byte-for-byte.')
          PY
      - name: Remove temporary transfer workflows
        run: |
          git rm --ignore-unmatch .github/workflows/inspect-staged-archive.yml .github/workflows/apply-public-curation.yml
          git add -A
      - name: Run actual full-history repository checks
        run: |
          python scripts/publication_check.py
          python scripts/assure.py
          python scripts/assure.py --check
          git add governance/evaluation-results.json
      - name: Commit and push only if the branch has not changed
        env:
          TARGET_BRANCH: research/assignment-02-evidence-integration-20261009
        run: |
          current=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$current" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Integrate public research integrity, Cerrillos review draft, and optional Jev protocol'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "DELIVERY_COMMIT=$(git rev-parse HEAD)"
          echo "DELIVERY_TREE=$(git rev-parse HEAD^{tree})"
