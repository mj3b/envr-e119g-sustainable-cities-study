name: Finish authorized assignment integration
on:
  push:
    branches: [research/assignment-02-module-03-20261014]
    paths: [.github/workflows/finish-assignment-integration.yml]
permissions:
  contents: write
concurrency:
  group: envr-assignment-integration
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Verify complete transfer and every base and output file
        env:
          GH_TOKEN: ${{ github.token }}
          ACTUAL_PRIVATE: ${{ github.event.repository.private }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          repo='mj3b/envr-e119g-sustainable-cities-study'
          base='6b39353d3e6df173250c61ce329ed01e39f56767'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/research/assignment-02-module-03-20261014'
          assert os.environ['ACTUAL_PRIVATE']=='false'
          shas=['3390d08df8a25375f9b7c165b8d587474b3bfe08','73586d1d1ce54cb55f2fc39ca2bafbe676580cba','e6ba8faa4e092e773e709f3ce26a66c7c245a443','f2dc1255e3a7f88486992effc2e6ee91806416ac','222421ec7b85504b1ef2a85c6817696bbfef1327','3eeeb7abe01cc29760f4486e43b3f6eb3d1eb3c4','caf3b70f252ad25ea038c8dbfb256726a2ba8ca8','3ac6acd5c40a1c565a10394ce77ef09102efec0b','97e796a580a39381cf6084e1857fd99627a353cc','b77c022a1f461ab29e9e93d1a44071dd12f92e7f']
          parts=[]
          for sha in shas:
              request=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response: obj=json.load(response)
              assert obj['encoding']=='base64'
              data=base64.b64decode(''.join(obj['content'].split()),validate=True)
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              parts.append(data)
          packed=b''.join(parts)
          assert hashlib.sha256(packed).hexdigest()=='f5042d7c514ea25b5caa47b7f7a569c52e39e8f981b449a14e3d98914af8b42f'
          dec=lzma.LZMADecompressor(memlimit=100000000)
          raw=dec.decompress(packed,max_length=2000000)
          assert dec.eof and not dec.unused_data
          assert hashlib.sha256(raw).hexdigest()=='7cbd1d8f4a3f5675b1c1c4fe6bcc58ddda90aee133ae5e70b017887ee7a16e64'
          payload=json.loads(raw)
          assert payload['version']==1 and payload['base']==base and len(payload['files'])==54
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          root=pathlib.Path.cwd()
          def safe(name):
              rel=pathlib.PurePosixPath(name)
              assert not rel.is_absolute() and not any(x in rel.parts for x in ('..','.git','private','sources','transcripts'))
              assert '\\' not in name and rel.suffix in ('.md','.json','.py')
              path=root.joinpath(*rel.parts)
              assert not path.is_symlink() and not any(p.is_symlink() for p in path.parents)
              return path
          old_activities=json.loads((root/'methods/ai-activity.json').read_text())['activities']
          pending=[];seen=set()
          for entry in payload['files']:
              name=entry['path'];assert name not in seen;seen.add(name)
              path=safe(name);prior=path.read_bytes() if path.is_file() else None
              assert (hashlib.sha256(prior).hexdigest() if prior is not None else None)==entry['before'],name
              change=entry['change']
              if change['kind']=='content': text=change['text']
              elif change['kind']=='splice':
                  assert prior is not None
                  text=prior.decode('utf-8');a,b=change['start'],change['end']
                  assert 0<=a<=b<=len(text)
                  text=text[:a]+change['text']+text[b:]
              else:raise ValueError('Unexpected change')
              data=text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==entry['after'],name
              pending.append((path,data))
          audit_path='audit/2026-10-14-assignment-integration.json'
          audit=json.loads(next(data for path,data in pending if path.relative_to(root).as_posix()==audit_path))
          def protected():
              for name,digest in audit['protected_sha256'].items():
                  assert hashlib.sha256(safe(name).read_bytes()).hexdigest()==digest,name
          protected()
          for path,data in pending:
              path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(data)
          protected()
          assert json.loads((root/'methods/ai-activity.json').read_text())['activities'][:len(old_activities)]==old_activities
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'assignment-delivery';out.mkdir()
          (out/'materialized-files.json').write_text(json.dumps([{k:e[k] for k in ('path','before','after')} for e in payload['files']],indent=2)+'\n')
          print('Verified complete ten-part transfer, all 54 changed-file hashes, eight protected research files and prior AI activity objects.')
          PY
      - name: Remove temporary delivery files and run actual full-history checks
        run: |
          git rm --ignore-unmatch .github/workflows/prepare-assignment-integration.yml .github/workflows/recover-and-verify-assignment.yml .github/workflows/finish-assignment-integration.yml audit/assignment-delivery-trigger.json
          git add -A
          python scripts/markdown_audit.py > "$RUNNER_TEMP/assignment-delivery/markdown-screen.json"
          python scripts/research_progress.py --check
          python scripts/publication_check.py
          python scripts/assure.py
          python scripts/assure.py --check
          git add governance/evaluation-results.json
          tree=$(git write-tree)
          git archive --format=zip --output="$RUNNER_TEMP/assignment-delivery/prepared-source.zip" "$tree"
          git diff --cached --stat > "$RUNNER_TEMP/assignment-delivery/change-stat.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/assignment-delivery/trigger-commit.txt"
          git rev-parse HEAD^{tree} > "$RUNNER_TEMP/assignment-delivery/base-tree.txt"
          printf '%s\n' "$tree" > "$RUNNER_TEMP/assignment-delivery/prepared-tree.txt"
          cp governance/evaluation-results.json "$RUNNER_TEMP/assignment-delivery/evaluation-results.json"
          sha256sum "$RUNNER_TEMP/assignment-delivery/prepared-source.zip"
      - name: Store verified non-workflow blobs for connector publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,concurrent.futures,hashlib,json,os,pathlib,subprocess,urllib.request
          names=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0')
          deletes={'.github/workflows/prepare-assignment-integration.yml','.github/workflows/recover-and-verify-assignment.yml','.github/workflows/finish-assignment-integration.yml','audit/assignment-delivery-trigger.json'}
          def upload(name):
              path=pathlib.Path(name)
              if not path.exists():
                  assert name in deletes
                  return {'path':name,'mode':'100644','type':'blob','sha':None}
              assert not name.startswith('.github/') and path.suffix in ('.md','.json','.py')
              data=path.read_bytes();expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              request=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response: obj=json.load(response)
              assert obj['sha']==expected
              return {'path':name,'mode':'100644','type':'blob','sha':expected}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:entries=list(pool.map(upload,names))
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'assignment-delivery'
          (out/'tree-entries.json').write_text(json.dumps(entries,indent=2)+'\n')
          print('CONNECTOR_BASE_COMMIT',os.environ['GITHUB_SHA'])
          print('CONNECTOR_TREE_ENTRIES',json.dumps(entries,separators=(',',':')))
          print('Prepared files and stored blobs only; no branch ref, PR, release, course submission or human scholarly approval changed by this job.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-assignment-integration-${{ github.run_id }}
          path: ${{ runner.temp }}/assignment-delivery/
          retention-days: 7
          if-no-files-found: error
