name: Inspect prepared update
on:
  push:
    branches: [research/assignment-02-evidence-integration-20261009]
    paths: [.github/workflows/recover-prepared.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Require intended private repository
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: test "$PRIVATE" = true && test "$GITHUB_REPOSITORY" = mj3b/envr-e119g-sustainable-cities-study
      - name: Recover bytes without executing recovered content
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, urllib.request
          shas = 'ec4e254d225451cc670647b9b1d7c1c36da2d70b 3cf84460153ec76dbaaa610179025857665297fb 06d7aa3fba9eee1a8c4044a7770b0d204ee72198 7e3673666344fdc42cb786780cc51a3886260661 4d270aaebb10b0fb9d40b566934912a848804f47 83ed3e965c6a43abd0f677f70e8afd1271b1849e 0a954b1c20f0226fbeb887215580cf4fa0200a0f 3ac28c3c416a9c98ef20cc619c93e6ed685082a2 bae3406a9aacccac6b1c72026ebb089ffc5f3292 4653106584f6422d7d49a501c5298e4193a788ce 522601c23f55394f01774add6306e9e7389814d3 447cd55e0db7fd1cefe70f541dc1ffb532bdd32d'.split()
          out = pathlib.Path(os.environ['RUNNER_TEMP'])/'recovery'; out.mkdir()
          parts=[]; report={'parts':[], 'executed_recovered_content':False}
          for sha in shas:
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: obj=json.load(response)
              data=base64.b64decode(obj['content']); actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if actual != sha: raise ValueError('Blob integrity mismatch')
              parts.append(data); report['parts'].append({'sha':sha,'bytes':len(data)})
          data=b''.join(parts); (out/'staged.xz').write_bytes(data)
          report['compressed_sha256']=hashlib.sha256(data).hexdigest()
          decoder=lzma.LZMADecompressor()
          try:
              raw=decoder.decompress(data,max_length=20000000)
              (out/'recovered.bin').write_bytes(raw)
              report.update({'decompressed_bytes':len(raw),'eof':decoder.eof,'sha256':hashlib.sha256(raw).hexdigest(),'prefix':repr(raw[:80])})
          except Exception as exc: report['decode_error']=str(exc)
          (out/'diagnostic.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-prepared-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery/
          retention-days: 7
          if-no-files-found: error
