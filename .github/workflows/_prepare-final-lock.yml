name: Prepare approved Assignment 2 final lock
on:
  push:
    branches: [finalize-assignment2-v011]
permissions:
  contents: write
concurrency:
  group: prepare-approved-v011
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'mj3b/envr-e119g-sustainable-cities-study' && github.ref == 'refs/heads/finalize-assignment2-v011'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply only the hash-bound approved text edits
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = mj3b/envr-e119g-sustainable-cities-study
          git merge-base --is-ancestor f1d019ae20b860efdbcdbdcf36e41b4288813e81 HEAD
          python - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma,os
          folder=Path('.github/final-lock-payload')
          packed=base64.b64decode(''.join((folder/f'part-{i}.b64').read_text() for i in range(4)),validate=True)
          assert len(packed)==22692
          assert hashlib.sha256(packed).hexdigest()=='218034c3586e7598a1def39a445a003044ec96bd6b616d77412bb86d02ef3798'
          raw=lzma.decompress(packed,memlimit=256*1024*1024)
          assert len(raw)==88679
          assert hashlib.sha256(raw).hexdigest()=='3bd1b12aa04a6481f71349003e0eb68edc964ebdd86f60c4edfe61379c16f387'
          data=json.loads(raw)
          assert data['repository']==os.environ['GITHUB_REPOSITORY']
          assert data['base_commit']=='f1d019ae20b860efdbcdbdcf36e41b4288813e81'
          assert len(data['files'])==26 and len({x['path'] for x in data['files']})==26
          for item in data['files']:
              path=Path(item['path'])
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert path.suffix in {'.md','.json','.py','.yml'}
              assert 'private' not in path.parts and 'transcripts' not in path.parts
              assert not path.is_symlink()
              if path.as_posix().startswith('.github/'):
                  assert path.as_posix()=='.github/workflows/publish-final-checkpoint.yml'
              before=path.read_bytes() if path.exists() else None
              assert (hashlib.sha256(before).hexdigest() if before is not None else None)==item['before_sha256'],str(path)
              op=item['operation']
              if op['kind']=='new':
                  assert before is None
                  after=op['text']
              elif op['kind']=='line_edits':
                  assert before is not None
                  lines=before.decode('utf-8').splitlines(keepends=True)
                  for edit in reversed(op['edits']):
                      assert 0<=edit['start']<=edit['end']<=len(lines)
                      lines[edit['start']:edit['end']]=edit['lines']
                  after=''.join(lines)
              else:
                  raise ValueError('Unsupported edit kind')
              assert hashlib.sha256(after.encode()).hexdigest()==item['after_sha256'],str(path)
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(after,encoding='utf-8')
          for name,expected in data['protected_sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest()==expected,name
          for i in range(4):(folder/f'part-{i}.b64').unlink()
          folder.rmdir()
          Path('.github/workflows/_prepare-final-lock.yml').unlink()
          Path(os.environ['RUNNER_TEMP'],'expected-fingerprint.txt').write_text(data['expected_final_fingerprint'])
          print('Applied 26 approved changes for verification. Protected research bytes retained.')
          PY
      - name: Verify the intended final tree with full history
        run: |
          set -euo pipefail
          pip install -r requirements-dev.txt
          git add -A
          python scripts/check_final_assignment.py
          python scripts/publication_check.py
          python scripts/assure.py
          python scripts/assure.py --check
          python - <<'PY'
          import json,os
          from pathlib import Path
          receipt=json.loads(Path('governance/evaluation-results.json').read_text())
          expected=Path(os.environ['RUNNER_TEMP'],'expected-fingerprint.txt').read_text()
          assert receipt['fingerprint']==expected
          assert receipt['automated_status']=='pass'
          print('Intended final fingerprint verified:',expected)
          PY
          git add governance/evaluation-results.json
          echo "Verified final tree before authorized workflow-file transfer: $(git write-tree)" >> "$GITHUB_STEP_SUMMARY"
      - name: Push content only; leave workflow changes to the connected authorized editor
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/finalize-assignment2-v011
          git restore --source=HEAD --staged --worktree .github/workflows/_prepare-final-lock.yml
          git rm .github/workflows/publish-final-checkpoint.yml
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Stage verified final-lock content; workflow-file completion remains pending'
          git push origin HEAD:refs/heads/finalize-assignment2-v011
          echo "Intermediate content commit: $(git rev-parse HEAD). Do not merge until the authorized workflow-file completion and exact-head CI pass." >> "$GITHUB_STEP_SUMMARY"
