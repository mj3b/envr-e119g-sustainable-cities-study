name: Inspect staged archive
on:
  push:
    branches: [research/assignment-02-evidence-integration-20261009]
    paths: [.github/workflows/inspect-staged-archive.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect stored bytes only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,urllib.request,zipfile,io
          assert os.environ['GITHUB_REPOSITORY']=='mj3b/envr-e119g-sustainable-cities-study'
          shas='ec4e254d225451cc670647b9b1d7c1c36da2d70b 3cf84460153ec76dbaaa610179025857665297fb 06d7aa3fba9eee1a8c4044a7770b0d204ee72198 7e3673666344fdc42cb786780cc51a3886260661 4d270aaebb10b0fb9d40b566934912a848804f47 83ed3e965c6a43abd0f677f70e8afd1271b1849e 0a954b1c20f0226fbeb887215580cf4fa0200a0f 3ac28c3c416a9c98ef20cc619c93e6ed685082a2 bae3406a9aacccac6b1c72026ebb089ffc5f3292 4653106584f6422d7d49a501c5298e4193a788ce 522601c23f55394f01774add6306e9e7389814d3 447cd55e0db7fd1cefe70f541dc1ffb532bdd32d'.split()
          parts=[]
          for sha in shas:
            req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN']})
            with urllib.request.urlopen(req,timeout=30) as r: o=json.load(r)
            data=base64.b64decode(o['content']); assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
            parts.append(data)
          data=b''.join(parts); dec=lzma.LZMADecompressor(); raw=dec.decompress(data,max_length=20000000)
          print('compressed_sha256',hashlib.sha256(data).hexdigest(),'bytes',len(data),'decompressed_bytes',len(raw),'eof',dec.eof)
          assert dec.eof and not dec.unused_data
          if zipfile.is_zipfile(io.BytesIO(raw)):
            z=zipfile.ZipFile(io.BytesIO(raw)); print('format ZIP; count',len(z.namelist())); print('root names',sorted({n.split('/')[0] for n in z.namelist()}))
          else:
            o=json.loads(raw); print('format JSON; root type',type(o).__name__)
            if isinstance(o,dict):
              print('keys',list(o.keys()))
              for k,v in o.items():
                print('field',k,'type',type(v).__name__,'length',len(v) if hasattr(v,'__len__') else None)
                if isinstance(v,list) and v and isinstance(v[0],dict): print('item keys',list(v[0].keys()))
          PY
