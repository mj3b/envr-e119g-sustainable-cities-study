name: Recover and verify assignment update
on:
  push:
    branches: [research/assignment-02-module-03-20261014]
    paths: [.github/workflows/recover-and-verify-assignment.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve each referenced part as data and identify any failed delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import ast,base64,hashlib,json,lzma,os,pathlib,urllib.request,urllib.error
          repo='mj3b/envr-e119g-sustainable-cities-study'
          assert os.environ['GITHUB_REPOSITORY']==repo
          assert os.environ['GITHUB_REF']=='refs/heads/research/assignment-02-module-03-20261014'
          data=pathlib.Path('.github/workflows/prepare-assignment-integration.yml').read_bytes()
          assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()=='38793fab4875a3b58b76801a7cc7382ef0d54b2c'
          shas=ast.literal_eval(next(l.strip().split('=',1)[1] for l in data.decode().splitlines() if l.strip().startswith('shas=')))
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'assignment-recovery';out.mkdir()
          rows=[]; parts=[]; prefix=True
          for i,sha in enumerate(shas):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r: obj=json.load(r)
                  b=base64.b64decode(''.join(obj['content'].split()),validate=True)
                  assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()==sha
                  (out/f'part-{i:02d}.bin').write_bytes(b)
                  rows.append({'index':i,'sha':sha,'bytes':len(b),'status':'retrieved_hash_verified'})
                  if prefix:parts.append(b)
              except urllib.error.HTTPError as exc:
                  rows.append({'index':i,'sha':sha,'status':'HTTP_'+str(exc.code)})
                  prefix=False
          decoder=lzma.LZMADecompressor(memlimit=100000000)
          raw=decoder.decompress(b''.join(parts),max_length=2000000)
          (out/'payload-prefix.json.partial').write_bytes(raw)
          report={'parts':rows,'stream_complete':decoder.eof,'recovered_bytes':len(raw),'recovered_sha256':hashlib.sha256(raw).hexdigest(),'executed':False,'branch_published':False}
          (out/'recovery-report.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: recovered-assignment-inspection-${{ github.run_id }}
          path: ${{ runner.temp }}/assignment-recovery/
          retention-days: 2
          if-no-files-found: error
