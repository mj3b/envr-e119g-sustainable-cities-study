name: Prepare writing and AI-record update
on:
  push:
    branches: [docs/writing-voice-ai-records-20261010]
    paths: [.github/workflows/prepare-writing-release.yml]
permissions:
  contents: write
concurrency:
  group: envr-writing-records-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require the authorized repository and branch
        env:
          PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$GITHUB_REPOSITORY" = mj3b/envr-e119g-sustainable-cities-study
          test "$GITHUB_REF" = refs/heads/docs/writing-voice-ai-records-20261010
          test "$PRIVATE" = false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Verify the complete delta before changing files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          repo='mj3b/envr-e119g-sustainable-cities-study'
          base='62ac291605b791511c4178493da3bd767bf481c0'
          shas=['9861aa3edac1e31fa9adbbe8030c3a888baab3eb','6595ca3557d00984e97b1945ab266828f3589b93','cb0c3214db62a31fdbcfb629302d954f3cc6ed29']
          digest='c6c137e09386eadecfc788c07c5047b1d749edb847c01dd381ee1affa08fd478'
          parts=[]
          for sha in shas:
              req=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs/'+sha,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: obj=json.loads(response.read(1000000))
              if obj.get('encoding')!='base64': raise ValueError('Unexpected encoding')
              data=base64.b64decode(''.join(obj['content'].split()),validate=True)
              if hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()!=sha: raise ValueError('Blob integrity failure')
              parts.append(data)
          packed=b''.join(parts)
          if len(packed)!=31992 or hashlib.sha256(packed).hexdigest()!=digest: raise ValueError('Aggregate integrity failure')
          dec=lzma.LZMADecompressor(); raw=dec.decompress(packed,max_length=1000000)
          if not dec.eof or dec.unused_data: raise ValueError('Invalid or oversized archive')
          payload=json.loads(raw)
          if payload['schema_version']!=1 or payload['base_commit']!=base or len(payload['files'])!=36: raise ValueError('Unexpected payload structure')
          subprocess.run(['git','merge-base','--is-ancestor',base,'HEAD'],check=True)
          root=pathlib.Path.cwd(); pending=[]; seen=set()
          for entry in payload['files']:
              name=entry['path']; rel=pathlib.PurePosixPath(name)
              if name in seen or rel.is_absolute() or any(p in ('.git','..','private') for p in rel.parts) or '\\' in name or name.startswith('.github/'): raise ValueError('Unsafe path')
              if rel.suffix not in ('.md','.json','.py'): raise ValueError('Unexpected file type')
              target=root.joinpath(*rel.parts)
              if target.is_symlink() or any(p.is_symlink() for p in target.parents if p!=root.parent): raise ValueError('Symlink not permitted')
              prior=target.read_bytes() if target.is_file() else None
              old=hashlib.sha256(prior).hexdigest() if prior is not None else None
              if old!=entry['old_sha256']: raise ValueError('Base conflict: '+name)
              modes=[k for k in ('content','line_edits') if k in entry]
              if len(modes)!=1: raise ValueError('Ambiguous delta')
              if modes[0]=='content':
                  if prior is not None: raise ValueError('New file already exists')
                  data=entry['content'].encode('utf-8')
              else:
                  if prior is None: raise ValueError('Missing delta input')
                  lines=prior.decode('utf-8').splitlines(keepends=True); last=0
                  for start,end,text in entry['line_edits']:
                      if type(start) is not int or type(end) is not int or not (last<=start<=end<=len(lines)) or not isinstance(text,str): raise ValueError('Invalid line edit')
                      last=end
                  for start,end,text in reversed(entry['line_edits']): lines[start:end]=[text]
                  data=''.join(lines).encode('utf-8')
              if hashlib.sha256(data).hexdigest()!=entry['sha256']: raise ValueError('Output integrity failure: '+name)
              seen.add(name); pending.append((target,data))
          for target,data in pending:
              target.parent.mkdir(parents=True,exist_ok=True); target.write_bytes(data)
          print('Verified all 36 input/output identities before applying the delta.')
          print('DELTA_SHA256',digest)
          PY
      - name: Remove temporary preparation workflow from the final tree
        run: |
          git rm .github/workflows/prepare-writing-release.yml
          git add -A
      - name: Run full-history automated checks and generate the actual receipt
        run: |
          python scripts/publication_check.py
          python scripts/assure.py
          python scripts/assure.py --check
          git add governance/evaluation-results.json
      - name: Store verified non-workflow blobs for authorized connector publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,concurrent.futures,hashlib,json,os,pathlib,subprocess,urllib.request
          names=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0')
          if len(names)!=38: raise ValueError('Unexpected changed-file count')
          def upload(name):
              if name=='.github/workflows/prepare-writing-release.yml': return {'path':name,'mode':'100644','type':'blob','sha':None}
              if name.startswith('.github/'): raise ValueError('Unapproved workflow change')
              data=pathlib.Path(name).read_bytes()
              expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              req=urllib.request.Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs',data=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as response: obj=json.load(response)
              if obj['sha']!=expected: raise ValueError('Uploaded blob mismatch: '+name)
              return {'path':name,'mode':'100644','type':'blob','sha':obj['sha']}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool: entries=list(pool.map(upload,names))
          print('CONNECTOR_BASE_COMMIT',os.environ['GITHUB_SHA'])
          print('CONNECTOR_BASE_TREE',subprocess.check_output(['git','rev-parse','HEAD^{tree}']).decode().strip())
          print('CONNECTOR_TREE_ENTRIES',json.dumps(entries,separators=(',',':')))
          print('Only blobs were stored. Branch refs, research claims, human review and course submission were not changed by this step.')
          PY
