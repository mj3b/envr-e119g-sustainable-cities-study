name: Study integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Check explicitly authorized public mode
        env:
          ACTUAL_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$GITHUB_REPOSITORY" = mj3b/envr-e119g-sustainable-cities-study
          test "$ACTUAL_PRIVATE" = false
          python scripts/publication_check.py
      - run: python scripts/assure.py --check
      - run: python scripts/assure.py
  prepare_review_packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/publication_check.py
      - run: python scripts/assure.py
      - run: git archive --format=zip --output=tracked-review-snapshot.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: study-review-packet-${{ github.run_id }}
          path: |
            governance/evaluation-results.json
            tracked-review-snapshot.zip
          retention-days: 7
          if-no-files-found: error
