name: Study integrity
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - name: Check explicitly authorized public mode
        env:
          ACTUAL_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$GITHUB_REPOSITORY" = mj3b/envr-e119g-sustainable-cities-study
          test "$ACTUAL_PRIVATE" = false
          python scripts/publication_check.py
      - run: python scripts/assure.py --check
      - run: python scripts/assure.py
  prepare_review_packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/publication_check.py
      - run: python scripts/assure.py
      - run: git archive --format=zip --output=tracked-review-snapshot.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: study-review-packet-${{ github.run_id }}
          path: |
            governance/evaluation-results.json
            tracked-review-snapshot.zip
          retention-days: 7
          if-no-files-found: error

  evidence_review_demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: methods/evidence-review
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -v test_workflow
      - name: Check saved notebook output against execution
        run: python ../../scripts/check_notebooks.py --execute-worked
      - name: Replay the preserved Cerrillos case and tests
        run: python -B ../../research/cerrillos/assignment-04/check_replay.py > "$RUNNER_TEMP/cerrillos-replay.json"
      - uses: actions/upload-artifact@v4
        with:
          name: cerrillos-replay-${{ github.run_id }}
          path: ${{ runner.temp }}/cerrillos-replay.json
          retention-days: 7
          if-no-files-found: error
